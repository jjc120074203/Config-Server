<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="startScreen">
    <h1>坦克大战</h1>
    <p>经典街机游戏 · 保卫你的基地</p>
    <button class="btn" id="startBtn">开始游戏</button>
    <p style="margin-top: 16px; font-size: 12px; color: #666;">按 Enter 键也可开始</p>
  </div>

  <div id="gameOverScreen" style="display:none">
    <h1 id="gameOverTitle">游戏结束</h1>
    <p class="final-score" id="finalScore">得分: 0</p>
    <button class="btn" id="restartBtn">再来一局</button>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div class="sidebar">
      <div class="panel">
        <h3>状态</h3>
        <div class="stat-row">
          <span class="stat-label">得分</span>
          <span class="stat-value" id="scoreVal">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">关卡</span>
          <span class="stat-value" id="levelVal">1</span>
        </div>
        <div class="stat-row" style="margin-top: 8px;">
          <span class="stat-label">生命</span>
        </div>
        <div class="lives-display" id="livesDisplay"></div>
      </div>

      <div class="panel">
        <h3>敌军</h3>
        <div class="enemy-indicator" id="enemyDisplay"></div>
      </div>

      <div class="panel">
        <h3>操作</h3>
        <div class="controls-list">
          <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动</div>
          <div>或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
          <div><kbd>空格</kbd> / <kbd>J</kbd> 射击</div>
        </div>
      </div>

      <div class="panel">
        <h3>道具说明</h3>
        <div class="controls-list">
          <div><span style="color:#4ecdc4;font-weight:bold">S</span> 护盾</div>
          <div><span style="color:#74b9ff;font-weight:bold">F</span> 冻结敌军</div>
          <div><span style="color:#e94560;font-weight:bold">+</span> 额外生命</div>
          <div><span style="color:#ffd93d;font-weight:bold">B</span> 炸弹(全灭)</div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
